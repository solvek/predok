# Creates a GitHub release when a version tag (0.1, 0.2.1, …) is pushed, with the skill zip for
# Claude.ai attached. The stable link https://github.com/solvek/predok/releases/latest/download/predok-skill.zip
# always leads to the newest version release. The skill as it is on main is the rolling release
# `skill` (skill.yml), which predok.ai serves over MCP.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the skill zip
        run: ./scripts/build-skill-zip.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/predok-skill.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
